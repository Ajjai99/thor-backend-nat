name: Provision Tenant

# On-demand tenant onboarding (ADR §11). Starts the tenant-provisioning Step Functions state
# machine with the new tenant's details. No secret values are passed — only admin_email; Cognito
# issues the temporary password via its invite flow.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, qa, prod]
        required: true
      display_name:
        description: Tenant display name
        type: string
        required: true
      subdomain:
        description: Tenant subdomain (lowercase, e.g. acme)
        type: string
        required: true
      admin_email:
        description: Email of the tenant's first admin (receives a Cognito invite)
        type: string
        required: true
      tier_id:
        description: Tier id
        type: string
        default: "1"
        required: true
      isolation_type_id:
        description: Isolation type id
        type: string
        default: "1"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  # One provisioning run per subdomain+environment at a time.
  group: provision-${{ inputs.environment }}-${{ inputs.subdomain }}
  cancel-in-progress: false

jobs:
  start-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Reuses the shared per-env Environments; qa/prod require review before the job runs.
    environment: ${{ inputs.environment }}
    outputs:
      execution_arn: ${{ steps.start.outputs.execution_arn }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || vars.PROD_AWS_ROLE_ARN }}
          # Region is per-environment (<ENV>_AWS_REGION), like every other workflow here.
          # No fallback: a missing var must fail loudly, not silently target the wrong region.
          aws-region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || vars.PROD_AWS_REGION }}

      - name: Start tenant provisioning
        id: start
        env:
          AWS_REGION: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || vars.PROD_AWS_REGION }}
          ENVIRONMENT: ${{ inputs.environment }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          SUBDOMAIN: ${{ inputs.subdomain }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          TIER_ID: ${{ inputs.tier_id }}
          ISOLATION_TYPE_ID: ${{ inputs.isolation_type_id }}
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_MACHINE_ARN="arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:thor-${ENVIRONMENT}-tenant-provisioning"

          # Build the execution input as ProvisioningState. jq --arg escapes every value, so
          # nothing here can break out of the JSON. TierId/IsolationTypeId are coerced to numbers.
          INPUT=$(jq -n \
            --arg displayName "$DISPLAY_NAME" \
            --arg subdomain "$SUBDOMAIN" \
            --arg adminEmail "$ADMIN_EMAIL" \
            --argjson tierId "$TIER_ID" \
            --argjson isolationTypeId "$ISOLATION_TYPE_ID" \
            '{DisplayName: $displayName, Subdomain: $subdomain, AdminEmail: $adminEmail, TierId: $tierId, IsolationTypeId: $isolationTypeId}')

          echo "Starting execution on ${STATE_MACHINE_ARN}"
          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "$STATE_MACHINE_ARN" \
            --name "provision-${SUBDOMAIN}-$(date +%s)" \
            --input "$INPUT" \
            --query executionArn --output text)
          echo "Started ${EXECUTION_ARN}"
          echo "execution_arn=${EXECUTION_ARN}" >> "$GITHUB_OUTPUT"

  monitor-execution:
    needs: start-execution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No environment, so qa/prod don't ask for a second approval. Without it the AWS role is
    # assumed with the branch subject (ref:refs/heads/<branch>), so run dev from dev, qa from qa
    # and prod from main.
    outputs:
      status: ${{ steps.wait.outputs.status }}
      failed_step: ${{ steps.wait.outputs.failed_step }}
      reason: ${{ steps.wait.outputs.reason }}
      result: ${{ steps.wait.outputs.result }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'dev' && vars.DEV_AWS_ROLE_ARN || inputs.environment == 'qa' && vars.QA_AWS_ROLE_ARN || vars.PROD_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.environment == 'dev' && vars.DEV_AWS_REGION || inputs.environment == 'qa' && vars.QA_AWS_REGION || vars.PROD_AWS_REGION }}

      - name: Wait for provisioning to finish
        id: wait
        env:
          EXECUTION_ARN: ${{ needs.start-execution.outputs.execution_arn }}
        run: |
          set -euo pipefail

          while true; do
            STATUS=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query status --output text)
            echo "$(date -u +%T) ${STATUS}"
            if [ "$STATUS" != "RUNNING" ]; then
              break
            fi
            sleep 15
          done
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "SUCCEEDED" ]; then
            RESULT=$(aws stepfunctions describe-execution --execution-arn "$EXECUTION_ARN" --query output --output text)
            echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          aws stepfunctions get-execution-history --execution-arn "$EXECUTION_ARN" > history.json

          # The failed step is the last one that started.
          FAILED_STEP=$(jq -r '[.events[] | select(.type == "TaskStateEntered")] | last | .stateEnteredEventDetails.name' history.json)

          # ProvisioningFailed only has a generic message. The real error is what the Catch passed into it.
          REASON=$(jq -r '.events[] | select(.type == "FailStateEntered") | .stateEnteredEventDetails.input | fromjson | .Cause | (fromjson? | .errorMessage) // .' history.json)
          REASON=${REASON:-Execution ${STATUS}}

          echo "failed_step=${FAILED_STEP}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "::error::${FAILED_STEP} failed: ${REASON}"
          exit 1

  execution-summary:
    needs: [start-execution, monitor-execution]
    # always() so a failed run still gets a summary.
    if: always() && needs.start-execution.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          SUBDOMAIN: ${{ inputs.subdomain }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          EXECUTION_ARN: ${{ needs.start-execution.outputs.execution_arn }}
          STATUS: ${{ needs.monitor-execution.outputs.status }}
          FAILED_STEP: ${{ needs.monitor-execution.outputs.failed_step }}
          REASON: ${{ needs.monitor-execution.outputs.reason }}
          RESULT: ${{ needs.monitor-execution.outputs.result }}
        run: |
          set -euo pipefail
          exec >> "$GITHUB_STEP_SUMMARY"

          echo "## Tenant provisioning: ${STATUS}"
          echo
          echo "- Tenant: ${DISPLAY_NAME} (\`${SUBDOMAIN}\`)"
          echo "- Environment: ${ENVIRONMENT}"
          echo "- Admin: ${ADMIN_EMAIL}"
          # arn:aws:states:<region>:<account>:execution:<state-machine>:<name>
          REGION=$(echo "$EXECUTION_ARN" | cut -d: -f4)
          echo "- Execution: https://${REGION}.console.aws.amazon.com/states/home?region=${REGION}#/v2/executions/details/${EXECUTION_ARN}"
          echo

          if [ -z "$STATUS" ]; then
            echo "The monitor job didn't finish, so the result is unknown."
            exit 0
          fi

          # Steps before the failed one are done, the ones after it never ran.
          MARK="✅"
          step() {
            if [ "$1" = "$FAILED_STEP" ]; then
              echo "- ❌ **$1**: $2"
              MARK="⏭️"
            else
              echo "- ${MARK} **$1**: $2"
            fi
          }
          echo "### Steps"
          step SeedTenantMetadata "add the tenant row to the Master DB"
          step CreateTenantDatabase "create the tenant database and its _rw / _ro roles"
          step CreateTenantTables "run the tenant schema migrations"
          step ProvisionCognito "set up the Cognito user pool, app client and admins group"
          step CreateAdminUser "create the admin user (Cognito emails the invite)"
          step ConfigureSubdomain "add the Route53 record for the subdomain"
          step FinalizeRouting "write tenant_routing and mark the tenant Active"
          echo

          if [ "$STATUS" = "SUCCEEDED" ]; then
            echo "### Created"
            jq -r '"- Tenant id: `\(.TenantId)`",
              "- Database: `\(.DatabaseName)`",
              "- DB users: `\(.RwDbUser)`, `\(.RoDbUser)`",
              "- Cognito user pool: `\(.UserPoolId)`",
              "- Cognito app client: `\(.AppClientId)`"' <<<"$RESULT"
          else
            echo "### Why it failed"
            echo "${REASON}"
          fi