name: Manifest write
description: "Writes a deploy/<service>/image.json manifest via the GitHub Contents API, merging into the environment's own key. Retries with a fresh read on a conflicting write."

inputs:
  service:
    required: true
  environment:
    description: The environment that just deployed (dev, qa, or prod).
    required: true
  digest:
    description: Image digest (JFrog artifact digest) being promoted
    required: true
  commit_id:
    required: true
  github_token:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        PATH_IN_REPO="deploy/${{ inputs.service }}/image.json"
        BRANCH="${{ github.ref_name }}"
        DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        MAX_ATTEMPTS=5

        for i in $(seq 1 "$MAX_ATTEMPTS"); do
          # Re-read on every attempt, not just the SHA — a retry means someone else wrote a different
          # environment's key in between, and merging against stale content would clobber it.
          EXISTING=$(gh api "repos/${{ github.repository }}/contents/${PATH_IN_REPO}?ref=${BRANCH}" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "{}")
          SHA=$(gh api "repos/${{ github.repository }}/contents/${PATH_IN_REPO}?ref=${BRANCH}" --jq '.sha' 2>/dev/null || echo "")

          # Merges into this environment's key only — other environments' recorded deployments are left untouched.
          CONTENT=$(echo "$EXISTING" | jq \
            --arg service "${{ inputs.service }}" \
            --arg env "${{ inputs.environment }}" \
            --arg digest "${{ inputs.digest }}" \
            --arg commitId "${{ inputs.commit_id }}" \
            --arg deployedAt "$DEPLOYED_AT" \
            '.service = $service | .[$env] = {digest: $digest, commitId: $commitId, deployedAt: $deployedAt}')
          CONTENT_B64=$(printf '%s' "$CONTENT" | base64 | tr -d '\n')

          if gh api --method PUT "repos/${{ github.repository }}/contents/${PATH_IN_REPO}" \
            -f message="chore(deploy): record ${{ inputs.service }} ${{ inputs.environment }} deployment (${{ inputs.digest }})" \
            -f content="$CONTENT_B64" \
            -f branch="$BRANCH" \
            ${SHA:+-f sha="$SHA"} >/dev/null 2>&1; then
            echo "Wrote $PATH_IN_REPO"
            exit 0
          fi

          echo "Attempt $i/$MAX_ATTEMPTS failed — likely a stale SHA (someone else wrote this file in between). Retrying with a fresh read..." >&2
          sleep $((i * 2))
        done

        echo "Failed to write $PATH_IN_REPO after $MAX_ATTEMPTS attempts." >&2
        exit 1
