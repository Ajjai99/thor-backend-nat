name: ECR login
description: Authenticates to AWS via OIDC and logs in to ECR.

inputs:
  role_arn:
    required: true
  region:
    required: true

outputs:
  registry:
    value: ${{ steps.login-ecr.outputs.registry }}

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}

    - uses: aws-actions/amazon-ecr-login@v2
      id: login-ecr
