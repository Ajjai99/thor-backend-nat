name: JFrog login
description: Logs Docker in to JFrog Artifactory's Docker registry using an access token.

inputs:
  jfrog_hostname:
    description: JFrog Artifactory hostname, no scheme (e.g. example.jfrog.io)
    required: true
  jfrog_username:
    description: JFrog user identity associated with the access token
    required: true
  jfrog_access_token:
    required: true

outputs:
  registry:
    description: Docker registry hostname (same as jfrog_hostname) — callers build the full image path (<registry>/<repo>/<service>:<tag>) on top of this.
    value: ${{ inputs.jfrog_hostname }}

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "${{ inputs.jfrog_access_token }}" | docker login "${{ inputs.jfrog_hostname }}" --username "${{ inputs.jfrog_username }}" --password-stdin
