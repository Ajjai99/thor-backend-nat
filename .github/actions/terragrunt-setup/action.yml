name: Terragrunt setup
description: Installs Terraform + Terragrunt and authenticates to AWS via OIDC.

inputs:
  role_arn:
    required: true
  region:
    required: true
  working_directory:
    required: true
  terraform_version:
    required: false
    default: "1.15.6"
  terragrunt_version:
    required: false
    default: "1.1.2"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - shell: bash
      run: |
        curl -sL -o /usr/local/bin/terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ inputs.terragrunt_version }}/terragrunt_linux_amd64"
        chmod +x /usr/local/bin/terragrunt

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}

    - shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: terragrunt init -reconfigure -no-color
