[project]
name = "thor-intelligence-engine"
version = "0.1.0"
description = "Thor Intelligence Engine: LangChain-based agents served over gRPC to Thor.Api."
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "grpcio-health-checking>=1.68",
    "langchain-core>=0.3",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 120
# Generated from proto/ by scripts/generate_grpc.py - not hand-written, not linted.
extend-exclude = ["src/thor/"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thor_intelligence_engine"]
