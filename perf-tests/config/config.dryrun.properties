# ============================================================
# THOR Dry Run Config — local validation before EC2
# Usage: jmeter -n -t test-plan.jmx -p config/config.dryrun.properties -l results/dryrun.jtl
# ============================================================

api.base.url=https://z392f87e7k.execute-api.us-east-2.amazonaws.com/dev

# --- Reduced load for local dry run ---
thread.count=5
ramp.up.seconds=10
test.duration.seconds=120

# --- Token ---
token.refresh.threshold.minutes=13

# --- ZIP pool ---
zip.pool.path=zip-pool
# Must match --tasks value used in generate_zip_pool.py
task.pool.size=10

# --- Connectors ---
connectors=AD,windows,CyberArc

# --- Faster think time for dry run ---
think.time.min.ms=0
think.time.max.ms=500

# --- Result output ---
result.file=results/dryrun.jtl
