# JMeter properties for the performance test, loaded with `jmeter -p`. Read in the test plan with ${__P(key)}.
# The workflow's "Run workflow" inputs are passed as -J and override the load settings below.
# This repo is public: never put API keys, passwords or tokens here — pass those from GitHub secrets as -J.

# --- Target system (the dummy plan's public fake API) ---
target.protocol=https
target.host=jsonplaceholder.typicode.com
target.port=443

# --- Load settings (defaults; the workflow inputs override these) ---
thread.count=5
ramp.up.seconds=10
test.duration.seconds=120
think.time.min.ms=0
think.time.max.ms=500

# --- HTTP timeouts ---
http.connect.timeout.ms=5000
http.response.timeout.ms=10000
