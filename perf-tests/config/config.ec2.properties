# ── EC2 Load Test Config ──────────────────────────────────────────────────────
# Run on EC2 (same region as Thor API) for minimum S3 upload latency.
#
# Usage:
#   jmeter -n -t test-plan.jmx -p config/config.ec2.properties \
#          -Jthread.count=50 -Jtest.duration.seconds=1800 \
#          -l results/ec2_run.jtl -j results/ec2_run.log \
#          -e -o results/ec2_report

api.base.url=https://z392f87e7k.execute-api.us-east-2.amazonaws.com/dev

# ZIP pool path, relative to the folder JMeter runs from (perf-tests/ locally, /opt/perf/tests on the EC2 instance)
zip.pool.path=zip-pool

# How many ZIPs exist per connector in the pool (match --tasks in generate_zip_pool.py)
task.pool.size=10

thread.count=50
ramp.up.seconds=60
test.duration.seconds=1800

token.refresh.threshold.minutes=13

think.time.min.ms=200
think.time.max.ms=1000

result.file=results/ec2_result.jtl
